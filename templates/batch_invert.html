<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Batch Invert PDFs</title>
</head>
<body>
    <h2>🌌 Batch Invert PDF Colors</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Select one or more PDF files:</label><br><br>
        <input type="file" name="pdfs" accept=".pdf" multiple required><br><br>
        <input type="submit" value="Invert Colors">
    </form>
</body>
</html>
