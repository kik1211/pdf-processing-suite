<!DOCTYPE html>
<html>
<head>
    <title>Compress PDFs</title>
</head>
<body>
    <h2>📉 Compress PDFs (Multiple Allowed)</h2>
    <form action="/compress" method="post" enctype="multipart/form-data">
        <input type="file" name="pdfs" accept=".pdf" multiple required><br><br>
        <input type="submit" value="Compress PDFs">
    </form>
    <p><a href="/">← Back to Home</a></p>
</body>
</html>
