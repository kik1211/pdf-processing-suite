<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Watermark Tool</title>
</head>
<body>
    <h1>Watermark PDFs</h1>
    <form method="POST" enctype="multipart/form-data">
        <label>Select PDFs:</label><br>
        <input type="file" name="pdfs" accept=".pdf" multiple required><br><br>

        <label>Watermark Text:</label><br>
        <input type="text" name="watermark_text" required><br><br>

        <label>Font Size:</label>
        <input type="number" name="font_size" value="20" min="5" max="100"><br><br>

        <label>Font Color (hex):</label>
        <input type="color" name="font_color" value="#000000"><br><br>

        <label for="rotation">Rotation (in degrees):</label>
	<input type="number" name="rotation" placeholder="Rotation (e.g., 45)" />


        <label>Opacity (0-1):</label>
        <input type="number" name="opacity" step="0.1" value="0.5" min="0" max="1"><br><br>

        <label>Watermark Position:</label>
        <select name="position">
            <option value="top">Top</option>
            <option value="center">Center</option>
            <option value="bottom">Bottom</option>
            <option value="custom">Custom (x, y below)</option>
        </select><br><br>

        <label>Custom X:</label>
        <input type="number" name="custom_x" value="100"><br>
        <label>Custom Y:</label>
        <input type="number" name="custom_y" value="100"><br><br>

        <input type="submit" value="Add Watermark">
    </form>
</body>
</html>
